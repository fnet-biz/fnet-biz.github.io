<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>お問い合わせありがとうございます｜有限会社エフネット</title>
<style>
:root{--navy:#16243a;--navy-2:#0c1422;--gold:#b99a5f;--gold-2:#e4d5b7;--text:#4f5a68}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--navy-2),var(--navy));font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#fff;line-height:1.8}
.card{width:min(680px,100%);padding:clamp(36px,7vw,64px);border:1px solid rgba(228,213,183,.3);background:#fff;color:var(--navy-2);box-shadow:0 24px 70px rgba(0,0,0,.2);text-align:center}
.mark{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 24px;background:var(--navy-2);color:var(--gold-2);font-family:Georgia,serif;font-size:22px}
h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(26px,5vw,38px);line-height:1.4}
p{margin:20px auto 0;max-width:520px;color:var(--text)}
a{display:inline-flex;align-items:center;justify-content:center;margin-top:30px;min-height:48px;padding:12px 24px;background:var(--gold);color:#111827;text-decoration:none;font-weight:700}
a:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">F</div>
  <h1>お問い合わせありがとうございます。</h1>
  <p>送信を受け付けました。内容を確認のうえ、担当者よりご連絡いたします。</p>
  <a href="./">トップページへ戻る</a>
</main>
</body>
</html>
